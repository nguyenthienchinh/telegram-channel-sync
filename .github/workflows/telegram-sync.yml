name: telegram-sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install telethon

      - name: Đồng bộ bài mới
        run: python gh_sync.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          TG_SOURCE: ${{ secrets.TG_SOURCE }}
          TG_DEST: ${{ secrets.TG_DEST }}
          MAX_RUNTIME: "270"
          POLL_SECONDS: "20"

      - name: Lưu tiến độ
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "cập nhật state" && git push)